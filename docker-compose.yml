services:
  backend1: 
    build:
      context: ./backend
    container_name: backend-1
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017/rtdoceditor
      BCRYPT_SALT_ROUNDS: 12
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
      - mongo
  backend2:
    build:
      context: ./backend
    container_name: backend-2
    ports:
      - "3004:3003"
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017/rtdoceditor
      BCRYPT_SALT_ROUNDS: 12
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
      - mongo
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend1
  redis: 
    image: redis:latest
    container_name: redis-server-comp
    ports: 
      - "6379:6379"

  mongo:
    image: mongo:8
    container_name: mongo-server
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db 

volumes:
  mongo-data: